id = "browser.opera-cache"
schema_version = 3
rule_version = 3
platform = "windows"
category = "browser"
risk = "safe"
default_selected = true
required_stopped_processes = ["opera.exe"]

[[applicability]]
kind = "anyOf"
items = [
  { kind = "applicationInstalled", identifiers = ["com.operasoftware.Opera", "Opera"] },
  { kind = "anyRootExists" },
]

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/Cache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/Code Cache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/GPUCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/DawnCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/DawnGraphiteCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/DawnWebGPUCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/GrShaderCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/GraphiteDawnCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable/Media Cache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/Cache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/Code Cache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/GPUCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/DawnCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/DawnGraphiteCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/DawnWebGPUCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/GrShaderCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/GraphiteDawnCache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable/Media Cache"

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera Stable"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[[roots]]
template = "${roaming_app_data}/Opera Software/Opera GX Stable"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[[roots]]
template = "${local_app_data}/Opera Software"
kind = "childDirectories"
child_names = ["Opera Stable", "Opera GX Stable"]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[[roots]]
template = "${local_app_data}/Opera Software/Opera Stable"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[[roots]]
template = "${local_app_data}/Opera Software/Opera GX Stable"
kind = "childDirectories"
child_names = ["Default", "Guest Profile", "System Profile"]
child_prefixes = ["Profile "]
suffixes = ["Cache", "Code Cache", "GPUCache", "DawnCache", "DawnGraphiteCache", "DawnWebGPUCache", "GrShaderCache", "GraphiteDawnCache", "Media Cache"]

[matcher]
kind = "all"

[execution]
kind = "deleteMatchingContents"
requires_app_close = true

[verification]
lifecycle = "verified"
evidence = "Opera caches use fixed leaves in legacy and named Local/Roaming profiles. Official migration documentation and isolated scan, dry-run, and deletion tests cover these leaves; credentials, sessions, settings, and site storage are excluded"
verified_at = "2026-10-25"
verified_platform = "windows"
references = [
  "https://help.opera.com/en/latest/web-preferences/#clearBrowsingData",
  "https://help.opera.com/en/latest/crashes-and-issues/",
  "https://blogs.opera.com/desktop/2023/08/resolving-profile-loss-issues-in-opera-version-102-0-4880-16/",
  "https://chromium.googlesource.com/chromium/src/+/main/chrome/common/chrome_constants.h",
]
